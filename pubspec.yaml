name: revault
description: "Vault Reimagined"
publish_to: "none"
version: 2.0.0

environment:
  sdk: ^3.9.2

dependencies:
  circular_menu: ^4.0.0
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  encrypt: ^5.0.3
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  flutter_slidable: ^4.0.3
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  local_auth: ^2.3.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_3.png"
